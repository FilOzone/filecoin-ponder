name: Setup

description: Ponder monorepo action setup

inputs:
  foundry:
    description: Install Foundry
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 11.0.0

    - name: Set up node
      uses: actions/setup-node@v5
      with:
        cache: pnpm
        node-version: 24.8
        registry-url: 'https://registry.npmjs.org'

    - name: Set up foundry
      if: inputs.foundry == 'true'
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: "v1.7.1"

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
